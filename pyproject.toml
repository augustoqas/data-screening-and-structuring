[project]
name = "ecommerce-triage"
version = "0.1.0"
description = "LLM pipeline that turns messy e-commerce support messages into validated, structured data - with an eval harness that measures every change."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
triage = "triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
